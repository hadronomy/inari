name: Kubernetes distribution

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/kubernetes.yaml
      - deploy/**
      - docs/kubernetes.md
      - justfile
      - mise.toml
      - scripts/validate-kubernetes*.sh
      - scripts/check-router-chart.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/kubernetes.yaml
      - deploy/**
      - docs/kubernetes.md
      - justfile
      - mise.toml
      - scripts/validate-kubernetes*.sh
      - scripts/check-router-chart.py

permissions: {}

concurrency:
  group: kubernetes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller-config:
    name: Rendered Controller configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install render tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: helm yq
          cache: true

      - name: Set up mbx
        uses: jdx/mr-boxington-action@2bbb8f141e40e388b509cc68fe0bfbe7bc4b6818 # v1
        with:
          version: 0.4.0

      - name: Validate rendered config with the Controller
        run: |
          for config in controller-only managed-work; do
            helm template inari deploy/helm/inari --namespace inari \
              --values "deploy/helm/inari/ci/${config}-values.yaml" \
              --show-only templates/configmap.yaml \
              | yq --unwrapScalar '.data["inari-server.toml"]' \
              >"${RUNNER_TEMP}/inari-server.toml"
            export INARI_SERVER_CONFIG="${RUNNER_TEMP}/inari-server.toml"
            mbx run --locked --package inari-server -- config validate
          done

  validate:
    name: Lint, render, and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: >-
            just
            python
            uv
            actionlint
            helm@4.2.3
            helm@3.21.3
            kustomize
            kubeconform
            kube-linter
            shellcheck
            yamllint
            yq
            aqua:helm/chart-testing
            pipx:yamale
          cache: true

      - name: Validate Kubernetes distribution
        run: just check-kubernetes

      - name: Publish required check status
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/publish-check-status
        with:
          context: Lint, render, and validate
          description: Kubernetes distribution validation completed
          state: ${{ job.status }}
        env:
          GH_TOKEN: ${{ github.token }}

  api-server:
    name: Kubernetes API server
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: >-
            just
            helm
            kustomize
            kubectl
            aqua:kubernetes-sigs/kind
          cache: true

      - name: Validate against Kubernetes
        run: just check-kubernetes-server

      - name: Publish required check status
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/publish-check-status
        with:
          context: Kubernetes API server
          description: Kubernetes API-server validation completed
          state: ${{ job.status }}
        env:
          GH_TOKEN: ${{ github.token }}
