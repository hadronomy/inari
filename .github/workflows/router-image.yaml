name: Router image

on:
  pull_request:
    paths:
      - .github/workflows/router-image.yaml
      - Cargo.toml
      - Cargo.lock
      - crates/inari-router/**
      - deploy/router/**
      - patches/**
  push:
    branches: [main]
    paths:
      - .github/workflows/router-image.yaml
      - Cargo.toml
      - Cargo.lock
      - crates/inari-router/**
      - deploy/router/**
      - patches/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: router-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and verify Router image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up mbx
        uses: jdx/mr-boxington-action@2bbb8f141e40e388b509cc68fe0bfbe7bc4b6818 # v1
        with:
          version: 0.4.0

      - name: Build Router Supervisor
        run: |
          mbx build --locked --release --package inari-router
          git diff --exit-code -- Cargo.lock
          mkdir -p "${RUNNER_TEMP}/inari-router-image"
          cp target/release/inari-router "${RUNNER_TEMP}/inari-router-image/"

      - name: Install verified stock Zenoh
        shell: bash
        run: |
          set -euo pipefail
          router_tools="${RUNNER_TEMP}/inari-stock-zenoh"
          mkdir -p "${router_tools}"
          curl --fail --location --retry 3 \
            https://github.com/eclipse-zenoh/zenoh/releases/download/1.9.0/zenoh-1.9.0-x86_64-unknown-linux-gnu-standalone.zip \
            --output "${router_tools}/zenoh.zip"
          echo 'f18081184b089e79e605f2c0cb3f7790fbf101ae94942988f716e19e1810a46e  zenoh.zip' \
            | (cd "${router_tools}" && sha256sum --check)
          unzip -q "${router_tools}/zenoh.zip" -d "${router_tools}"
          test -x "${router_tools}/zenohd"
          cp "${router_tools}/zenohd" "${RUNNER_TEMP}/inari-router-image/"

      - name: Set up container builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build verification image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/inari-router-image
          file: deploy/router/Dockerfile
          platforms: linux/amd64
          load: true
          tags: inari-router:verification

      - name: Verify packaged executables
        run: |
          docker run --rm --read-only inari-router:verification --version
          docker run --rm --read-only --entrypoint /usr/local/bin/zenohd inari-router:verification --version

      - name: Verify packaged management and policy expiry
        run: >-
          mbx test --locked --package inari-router --test container
          -- --ignored --exact packaged_router_acknowledges_policy_and_stops_on_expiry
        env:
          INARI_TEST_ROUTER_IMAGE: inari-router:verification

      - name: Install signing tool
        if: github.ref == 'refs/heads/main'
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: cosign
          cache: true

      - name: Authenticate to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish immutable Router image
        if: github.ref == 'refs/heads/main'
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ runner.temp }}/inari-router-image
          file: deploy/router/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/hadronomy/inari-router:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/hadronomy/inari
            org.opencontainers.image.revision=${{ github.sha }}
            dev.inari.zenoh.version=1.9.0

      - name: Sign Router image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "ghcr.io/hadronomy/inari-router@${IMAGE_DIGEST}"
