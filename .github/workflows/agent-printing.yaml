name: Agent printing

on:
  pull_request:
    paths:
      - ".github/workflows/agent-printing.yaml"
      - "packages/agent/**"
      - "packages/print-contracts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "mise.toml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-printing.yaml"
      - "packages/agent/**"
      - "packages/print-contracts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "mise.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-printing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  printing:
    name: Printing on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install_args: python uv
          cache: true

      - name: Test receipt storage and execution
        run: >-
          uv run --frozen --package inari pytest
          packages/agent/tests/test_spool_filesystem.py
          packages/agent/tests/test_spool_crypto.py
          packages/agent/tests/test_durable_spool_admission.py
          packages/agent/tests/test_physical_execution.py
          packages/agent/tests/test_windows_spool_submission.py
          packages/agent/tests/test_windows_secrets.py
          packages/agent/tests/test_printer_drivers.py
          packages/agent/tests/test_document_admission.py
          -q
