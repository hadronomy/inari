name: Controller

on:
  pull_request:
    paths:
      - .github/workflows/controller.yaml
      - Cargo.toml
      - Cargo.lock
      - crates/inari-gateway/**
      - crates/inari-router/**
      - crates/inari-migration/**
      - crates/inari-server/**
      - crates/inari-web/**
  push:
    branches: [main]
    paths:
      - .github/workflows/controller.yaml
      - Cargo.toml
      - Cargo.lock
      - crates/inari-gateway/**
      - crates/inari-router/**
      - crates/inari-migration/**
      - crates/inari-server/**
      - crates/inari-web/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controller:
    name: Controller tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Set up mbx
        uses: jdx/mr-boxington-action@2bbb8f141e40e388b509cc68fe0bfbe7bc4b6818 # v1
        with:
          version: 0.4.0

      - name: Lint Controller
        run: >-
          mbx clippy --locked
          --package inari-gateway --package inari-migration --package inari-server
          --all-targets -- -D warnings

      - name: Test Controller
        run: >-
          mbx test --locked
          --package inari-gateway --package inari-migration --package inari-server

      - name: Prepare isolated PostgreSQL databases
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE inari_test LOGIN PASSWORD 'inari_test'"
          sudo -u postgres createdb --owner=inari_test inari_enrollment_history_test
          sudo -u postgres createdb --owner=inari_test inari_enrollment_contract_test
          sudo -u postgres createdb --owner=inari_test inari_enrollment_http_test
          sudo -u postgres createdb --owner=inari_test inari_state_test
          sudo -u postgres createdb --owner=inari_test inari_router_policy_test
          sudo -u postgres createdb --owner=inari_test inari_payload_test

      - name: Test enrollment migrations and key history
        run: >-
          mbx test --locked --package inari-server --lib
          -- --ignored --exact managed_gateway::enrollment_tests::enrollment_migrations_retire_claims_and_retain_key_history
        env:
          INARI_TEST_DATABASE_URL: postgres://inari_test:inari_test@127.0.0.1:5432/inari_enrollment_history_test

      - name: Test atomic invitation enrollment
        run: >-
          mbx test --locked --package inari-server --lib
          -- --ignored --exact managed_gateway::enrollment_tests::enrollment_consumes_invitations_atomically
        env:
          INARI_TEST_DATABASE_URL: postgres://inari_test:inari_test@127.0.0.1:5432/inari_enrollment_contract_test

      - name: Test enrollment over HTTP
        run: >-
          mbx test --locked --package inari-server --test onboarding_http
          -- --ignored --exact enrollment_consumes_the_invitation_once
        env:
          INARI_TEST_DATABASE_URL: postgres://inari_test:inari_test@127.0.0.1:5432/inari_enrollment_http_test

      - name: Test signed Agent State and retirement
        run: >-
          mbx test --locked --package inari-server
          signed_state_recovers_acceptance_and_preserves_terminal_evidence
          -- --ignored
        env:
          INARI_TEST_DATABASE_URL: postgres://inari_test:inari_test@127.0.0.1:5432/inari_state_test

      - name: Test Router policy generations and credential retirement
        run: >-
          mbx test --locked --package inari-server --lib
          -- --ignored --exact managed_gateway::router_policy_tests::router_policy_generations_and_acknowledgments_are_transactional
        env:
          INARI_TEST_DATABASE_URL: postgres://inari_test:inari_test@127.0.0.1:5432/inari_router_policy_test

      - name: Test Managed Payload admission and replay
        run: >-
          mbx test --locked --package inari-server --lib
          -- --ignored --exact managed_gateway::managed_work::persistence_tests::managed_payload_admission_replay_and_deletion
        env:
          INARI_TEST_DATABASE_URL: postgres://inari_test:inari_test@127.0.0.1:5432/inari_payload_test
