[project]
name = "inari-print-contracts"
version = "1.20.0-alpha.11"
description = "Shared Inari document contracts for the Agent and Odoo"
requires-python = ">=3.12"
dependencies = ["rfc8785>=0.1.4,<1.0.0"]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["inari_print_contracts*"]

