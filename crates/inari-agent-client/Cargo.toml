[package]
name = "inari-agent-client"
version = "1.20.0-alpha.13"
authors.workspace = true
description = "Typed local-agent client for Inari desktop applications"
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[dependencies]
async-tungstenite = { workspace = true, features = ["tokio-rustls-platform-verifier"] }
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
keyring.workspace = true
pkcs8.workspace = true
progenitor.workspace = true
progenitor-client.workspace = true
reqwest.workspace = true
regress.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
service-manager.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_Packaging_Appx"] }

[dev-dependencies]
rustls = { workspace = true, features = ["ring"] }
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
serde_json.workspace = true
