{{- if .Values.zenoh.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inari.zenohConfigMapName" . }}
  labels:
    {{- include "inari.labels" . | nindent 4 }}
    app.kubernetes.io/component: zenoh
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- range $ordinal := until (int .Values.zenoh.replicas) }}
  {{- $peers := list }}
  {{- range $peer := until (int $.Values.zenoh.replicas) }}
  {{- if ne $peer $ordinal }}
  {{- $peers = append $peers (printf "tls/%s-zenoh-%d.%s-zenoh-headless.%s.svc.cluster.local:%d" (include "inari.fullname" $) $peer (include "inari.fullname" $) $.Release.Namespace (int $.Values.zenoh.service.port)) }}
  {{- end }}
  {{- end }}
  router-{{ $ordinal }}.toml: |
    fleet_id = {{ $.Values.managedGateway.routerPolicy.fleetId | quote }}
    state_directory = "/var/lib/inari-router/policy"
    signing_public_key_file = "/etc/inari-router/policy/signing-key.hex"
    zenoh_executable = "/usr/local/bin/zenohd"

    [management]
    address = "0.0.0.0:{{ $.Values.zenoh.management.port }}"
    certificate_file = "/etc/inari-router/management/tls.crt"
    private_key_file = "/etc/inari-router/management/tls.key"
    client_ca_file = "/etc/inari-router/management/ca.crt"
    controller_common_name = {{ $.Values.zenoh.management.controllerCommonName | quote }}

    [router]
    id = {{ printf "%s%02x" (include "inari.zenohIdPrefix" $) $ordinal | quote }}
    listen_endpoint = "tls/[::]:{{ $.Values.zenoh.service.port }}"
    probe_endpoint = "tls/{{ include "inari.fullname" $ }}-zenoh-{{ $ordinal }}.{{ include "inari.fullname" $ }}-zenoh-headless.{{ $.Release.Namespace }}.svc.cluster.local:{{ $.Values.zenoh.service.port }}"
    peer_endpoints = {{ $peers | toJson }}
    root_ca_file = "/etc/inari-router/tls/ca.crt"
    certificate_file = "/etc/inari-router/tls/tls.crt"
    private_key_file = "/etc/inari-router/tls/tls.key"
    probe_certificate_file = "/etc/inari-router/tls/tls.crt"
    probe_private_key_file = "/etc/inari-router/tls/tls.key"
  {{- end }}
{{- end }}
